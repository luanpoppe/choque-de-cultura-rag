<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Key Screen — Chat vazio · V1 Sala de cinema</title>
  <!-- Spine: DESIGN Brand/Colors/Typography · EXPERIENCE IA empty state · Flow UJ-2 entry -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1a1a1e;
      color: #e8e4dc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .browser {
      width: 100%;
      max-width: 720px;
      background: #0f0f12;
      border: 1px solid #2a2520;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.6);
    }
    .chrome {
      background: #18181c;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #2a2520;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: #8b2635; }
    .dot-a { background: #c9a227; opacity: .8; }
    .dot-g { background: #3d3d45; }
    .url { flex: 1; text-align: center; font-size: 12px; color: #6b6560; }
    header.app {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #2a2520;
    }
    .logo {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #d4a054;
    }
    .logo span { color: #e8e4dc; font-weight: 400; }
    .theme-toggle {
      background: #1f1f24;
      border: 1px solid #3d3530;
      color: #c9a227;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: default;
    }
    .empty {
      padding: 48px 24px 32px;
      text-align: center;
    }
    .empty h1 {
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.25;
      margin-bottom: 12px;
      color: #f0ebe3;
    }
    .empty p {
      font-size: 15px;
      line-height: 1.6;
      color: #9a948a;
      max-width: 420px;
      margin: 0 auto 28px;
    }
    .onboarding-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #8b2635 0%, #6b1a28 100%);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 32px;
      box-shadow: 0 4px 20px rgba(139,38,53,.35);
    }
    .onboarding-btn::before { content: "🎬"; }
    .hint {
      font-size: 13px;
      color: #6b6560;
      margin-bottom: 8px;
    }
    .composer {
      padding: 16px 20px 20px;
      border-top: 1px solid #2a2520;
      background: #0a0a0c;
    }
    .input-wrap {
      display: flex;
      gap: 10px;
      background: #18181c;
      border: 1px solid #3d3530;
      border-radius: 14px;
      padding: 6px 6px 6px 16px;
    }
    .input-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      color: #e8e4dc;
      font-size: 15px;
      outline: none;
    }
    .input-wrap input::placeholder { color: #6b6560; }
    .send {
      background: #d4a054;
      color: #0f0f12;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
    }
    footer {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      color: #4a4540;
      border-top: 1px solid #1f1f24;
    }
    footer a { color: #9a948a; }
  </style>
</head>
<body>
  <div class="browser">
    <div class="chrome">
      <span class="dot dot-r"></span>
      <span class="dot dot-a"></span>
      <span class="dot dot-g"></span>
      <span class="url">choque-rag.dev</span>
    </div>
    <header class="app">
      <div class="logo">Choque <span>RAG</span></div>
      <button class="theme-toggle" type="button">☀️ Claro</button>
    </header>
    <div class="empty">
      <h1>Pergunte qualquer coisa sobre o Choque de Cultura</h1>
      <p>Encontre em quais episódios algo foi dito — com link direto pro trecho no YouTube.</p>
      <button class="onboarding-btn" type="button">Não conheço Choque de Cultura — me dê exemplos</button>
      <p class="hint">Ou digite sua pergunta abaixo</p>
    </div>
    <div class="composer">
      <div class="input-wrap">
        <input type="text" placeholder="Ex.: Quando falaram de Dune?" />
        <button class="send" type="button">→</button>
      </div>
    </div>
    <footer><a href="#">GitHub</a> · Demo de portfólio · PoC v1</footer>
  </div>
</body>
</html>
